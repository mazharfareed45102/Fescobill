name: Build APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -PversionCode=$((GITHUB_RUN_NUMBER + 1))

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk FescoBill.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FescoBill-apk
          path: FescoBill.apk

      - name: Publish as a GitHub release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.$((GITHUB_RUN_NUMBER + 1))"
          gh release create "v$VERSION" FescoBill.apk \
            --target "$GITHUB_SHA" \
            --title "FESCO Bill app $VERSION" \
            --notes "Download **FescoBill.apk** below, open it on the phone and tap Install (allow \"Install unknown apps\" if Android asks). Installing a newer version keeps your saved bills."
