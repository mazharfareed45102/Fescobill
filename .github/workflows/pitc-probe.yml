name: Check FESCO bill server

# Run it by hand (Actions tab → "Check FESCO bill server" → Run workflow) to see whether
# bill.pitc.com.pk answers from outside Pakistan right now. No reference numbers are used.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check bill.pitc.com.pk
        shell: bash
        run: |
          set +e
          sudo apt-get install -y -qq dnsutils traceroute >/dev/null 2>&1
          echo "== address: A=[$(dig +short bill.pitc.com.pk A @8.8.8.8 | tr '\n' ' ')] AAAA=[$(dig +short bill.pitc.com.pk AAAA @8.8.8.8 | tr '\n' ' ')]"
          for url in https://bill.pitc.com.pk/fescobill http://bill.pitc.com.pk/fescobill; do
            echo "-- $url"
            curl -sS -o /dev/null -w "code=%{http_code} ip=%{remote_ip} connect=%{time_connect}s total=%{time_total}s\n" \
              --max-time 30 -A "Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36" "$url"
          done
          echo "== route to bill.pitc.com.pk:443"
          sudo traceroute -T -p 443 -w 2 -q 1 -m 20 bill.pitc.com.pk
          exit 0
